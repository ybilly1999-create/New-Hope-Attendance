{% extends "base.html" %}

{% block content %}
<div class="grid grid-cols-1 md:grid-cols-[200px_1fr] gap-6">
  <aside class="md:sticky md:top-6 self-start">
    <nav class="card !p-3 space-y-1 text-sm">
      <a href="{{ url_for('admin.dashboard') }}"
         class="block px-3 py-2 rounded-md {% if request.endpoint == 'admin.dashboard' %}bg-brand-100 text-brand-800 font-medium{% else %}hover:bg-gray-100 text-gray-700{% endif %}">📊 總覽</a>
      <a href="{{ url_for('admin.attendance_list') }}"
         class="block px-3 py-2 rounded-md {% if 'attendance' in (request.endpoint or '') %}bg-brand-100 text-brand-800 font-medium{% else %}hover:bg-gray-100 text-gray-700{% endif %}">✅ 出席記錄</a>
      <a href="{{ url_for('admin.members_list') }}"
         class="block px-3 py-2 rounded-md {% if 'member' in (request.endpoint or '') %}bg-brand-100 text-brand-800 font-medium{% else %}hover:bg-gray-100 text-gray-700{% endif %}">👥 會員管理</a>
      <a href="{{ url_for('admin.visitors_list') }}"
         class="block px-3 py-2 rounded-md {% if 'visitor' in (request.endpoint or '') %}bg-brand-100 text-brand-800 font-medium{% else %}hover:bg-gray-100 text-gray-700{% endif %}">🌱 新朋友</a>
      <a href="{{ url_for('admin.report') }}"
         class="block px-3 py-2 rounded-md {% if 'report' in (request.endpoint or '') %}bg-brand-100 text-brand-800 font-medium{% else %}hover:bg-gray-100 text-gray-700{% endif %}">📈 全年報表</a>
      <a href="{{ url_for('admin.qr_codes') }}"
         class="block px-3 py-2 rounded-md {% if 'qr' in (request.endpoint or '') %}bg-brand-100 text-brand-800 font-medium{% else %}hover:bg-gray-100 text-gray-700{% endif %}">🔲 QR Code</a>
      <a href="{{ url_for('admin.special_dates_list') }}"
         class="block px-3 py-2 rounded-md {% if 'special' in (request.endpoint or '') %}bg-brand-100 text-brand-800 font-medium{% else %}hover:bg-gray-100 text-gray-700{% endif %}">✦ 特殊日期</a>
      <a href="{{ url_for('admin.settings') }}"
         class="block px-3 py-2 rounded-md {% if 'setting' in (request.endpoint or '') %}bg-brand-100 text-brand-800 font-medium{% else %}hover:bg-gray-100 text-gray-700{% endif %}">⚙ 設定</a>
      <hr class="my-2">
      <a href="{{ url_for('main.index') }}" class="block px-3 py-2 rounded-md hover:bg-gray-100 text-gray-500 text-xs">→ 返回前台</a>
    </nav>
  </aside>

  <section>
    {% block admin_content %}{% endblock %}
  </section>
</div>
{% endblock %}

services:
  - type: web
    name: church-attendance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/init_db.py --seed-history data/history.xlsx --seed-members data/members.xlsx && gunicorn wsgi:app
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SERVICE_START_TIME
        value: "10:00"
      - key: PYTHON_VERSION
        value: 3.11.9
